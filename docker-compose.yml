services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autorent
      POSTGRES_USER: autorent
      POSTGRES_PASSWORD: local_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorent -d autorent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: replace-before-deployment-this-is-only-for-local-lab
      DJANGO_DEBUG: '1'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_HOST: db
      DB_NAME: autorent
      DB_USER: autorent
      DB_PASSWORD: local_dev_password
      DB_PORT: '5432'
    ports: ['8000:8000']
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
  frontend:
    build: ./frontend
    ports: ['5173:5173']
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on: [backend]
volumes:
  pgdata:
  node_modules:
